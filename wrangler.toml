name = "bkk-3d-atlas"
main = "src/index.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]

# Static asset binding serves everything under public/ on the
# worker's origin. The Worker below is intentionally thin so the
# entire surface area is the static files in public/.

[assets]
directory = "./public"
binding = "ASSETS"

# Custom domain. atlas.nonarkara.org is already on Cloudflare DNS
# (the nonarkara.org zone is in this account; bkk.nonarkara.org
# was already bound to a Worker in the BKKx edge-proxy).
[[routes]]
pattern = "atlas.nonarkara.org"
custom_domain = true

# Longdo API key for the iTIC traffic proxy at /api/traffic.
# Set the actual value as a Cloudflare secret (never commit it):
#   npx wrangler secret put LONGDO_KEY
# Until that's done, the /api/traffic endpoint returns 503 and the
# client falls back to /bkk-traffic-sample.geojson (a static
# OSM-derived sample that ships in the repo).
[vars]
LONGDO_FEED = "https://traffic.longdo.com/api/feed/itsth"
LONGDO_DATA_ORIGIN = "https://itic.longdo.com/opendata/"

# R2 bucket for the 3D Tiles dataset (follow-up; uncomment when the
# generate-3d-tiles.sh pipeline is run and the bucket is created).
#
# [[r2_buckets]]
# binding = "BKKX_TILES"
# bucket_name = "bkk-3d-tiles"
# preview_bucket_name = "bkk-3d-tiles-preview"

[observability]
enabled = true
