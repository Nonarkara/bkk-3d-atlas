name: Verify every branch

on:
  push:
  pull_request:

# Least privilege, matching security.yml. This job runs third-party Actions on
# every pull request, including from forks — it needs to read the tree and
# nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run typecheck
      - run: npm test # every scripts/test-*.mjs, so a new suite cannot be skipped
