name: Verify every branch

on:
  push:
  pull_request:

# Least privilege, matching security.yml. This job runs third-party Actions on
# every pull request, including from forks — it needs to read the tree and
# nothing else.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run typecheck
      - run: npm test # every scripts/test-*.mjs, so a new suite cannot be skipped
